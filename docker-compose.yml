services:
  postgres:
    image: postgres:16-alpine
    container_name: industrial-postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: industrial_operations
      POSTGRES_USER: industrial_operations
      POSTGRES_PASSWORD: industrial_operations
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U industrial_operations -d industrial_operations"]
      interval: 5s
      timeout: 5s
      retries: 5

  mosquitto:
    image: eclipse-mosquitto:2
    container_name: industrial-mosquitto
    ports:
      - "1883:1883"
    volumes:
      - ./mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf

  kafka:
    image: apache/kafka:3.7.0
    container_name: industrial-kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,PLAINTEXT_INTERNAL://:29092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092,PLAINTEXT_INTERNAL://kafka:29092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_INTERNAL:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 3

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: industrial-backend
    ports:
      - "8080:8080"
    environment:
      DATABASE_URL: jdbc:postgresql://postgres:5432/industrial_operations
      DATABASE_USERNAME: industrial_operations
      DATABASE_PASSWORD: industrial_operations
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      MQTT_BROKER_URL: tcp://mosquitto:1883
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_started
      mosquitto:
        condition: service_started

  simulator:
    build:
      context: ./simulator
      dockerfile: Dockerfile
    container_name: industrial-simulator
    environment:
      MQTT_BROKER_HOST: mosquitto
      MQTT_BROKER_PORT: 1883
      API_URL: http://backend:8080
      PUBLISH_INTERVAL: 1.0
    depends_on:
      backend:
        condition: service_started
      mosquitto:
        condition: service_started
    profiles:
      - simulator

volumes:
  postgres_data:
